<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESOP 车间中转</title><link rel="stylesheet" href="/static/style.css"><script defer src="/auth-ui/accounts.js"></script><script defer src="/static/app.js"></script></head><body><header><h1>ESOP 车间中转</h1><span>本地只读状态 · 不提供现场派发</span></header><main><p id="auth-message" role="status"></p><section id="login"><h2>登录车间中转</h2><form id="login-form" class="account-login"><label>账号<input id="username" autocomplete="username" maxlength="64" required></label><label>密码<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="login-button">登录</button></form></section><p id="message" role="status"></p><div id="content" hidden><div class="account-toolbar"><strong id="account-name"></strong><button id="change-password" hidden>修改密码</button><button id="logout">退出</button></div><div id="summary" class="summary"></div><h2>登记屏幕</h2><p>心跳仅表示 App 通信；中心失联时仍按终端原始最后联系时间判断。本页每10秒刷新。</p><div class="scroll"><table><thead><tr><th>屏幕</th><th>连接 / 最后心跳（UTC）</th><th>目标 / revision</th><th>实际 / 当前项</th><th>播放 / 待更新</th><th>错误</th></tr></thead><tbody id="devices"></tbody></table></div><h2>缓存下载</h2><div id="downloads"></div></div></main><dialog id="password-dialog"><h2>修改密码</h2><form id="password-form" class="account-login"><label>当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p id="password-message" role="status"></p><div><button id="password-button">保存密码</button><button id="close-password" type="button">关闭</button></div></form></dialog></body></html>
